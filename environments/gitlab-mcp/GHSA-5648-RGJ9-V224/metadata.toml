schema_version = 1
id = "gitlab-mcp/GHSA-5648-RGJ9-V224"
ghsa = "GHSA-5648-RGJ9-V224"
product = "gitlab-mcp"
title = "@zereight/mcp-gitlab has multiple safety-control bypasses: execute_graphql read-only + allow-list bypass, unauthenticated transports, session-exhaustion DoS"
lifecycle = "draft"
agent_specificity = "agent_unique"
# Advisory severity from the authoritative source, normalized to
# CRITICAL/HIGH/MEDIUM/LOW/NONE. Use "UNKNOWN" when no source publishes one.
severity = "HIGH"
advisories = ["https://github.com/advisories/GHSA-5648-rgj9-v224"]
description = "gitlab-mcp 2.1.28 (CWE-863, F1). The execute_graphql tool decides whether an MCP-supplied GraphQL document is a write operation with graphqlQueryContainsWriteOperation() in utils/graphql-query.ts, whose implementation is a single regular expression /(?:^|[};]\\s*)(mutation|subscription)\\b/ applied to the comment/stripped document. GraphQL ignores commas as insignificant separators, but the regex does not accept a leading comma, so a document such as \",mutation { ... }\" or \"# c\\n,mutation { ... }\" is classified as read-only: the GITLAB_READ_ONLY_MODE gate never fires and the raw document is POSTed to /api/graphql with the server-held operator token. The same execute_graphql branch also never calls rejectIfProjectScopedDeployment(), so GITLAB_PROJECT_ID / GITLAB_ALLOWED_PROJECT_IDS never restrict which project the mutation may modify. Trust boundary: any MCP client able to call execute_graphql while the operator enabled read-only mode obtains the write operations the operator token permits on arbitrary projects. The upstream fix (tag v2.1.30) replaces the regex with a brace-depth state machine that only accepts an operation keyword at a document position, and adds rejectIfProjectScopedDeployment(\"execute_graphql\") as the first statement of the branch."
prerequisites = [
  "GITLAB_READ_ONLY_MODE=true is the read-only gate that the classifier bypass evades.",
  "GITLAB_PROJECT_ID or GITLAB_ALLOWED_PROJECT_IDS must be configured for the project-scope guard to be load-bearing.",
]

[vulnerable]
version = "2.1.28"
source_url = "https://github.com/zereight/gitlab-mcp"
commit = "139a479147a52f65d47e8fee142214c4d5392468"
image = ""
archive = "vulnerable-source.tar.gz"

[patched]
version = "2.1.30"
source_url = "https://github.com/zereight/gitlab-mcp"
commit = "cff3ebeec272d7cc609d9b3cab57f52cb15fae96"
image = ""
archive = "patched-source.tar.gz"

[build]
# node:22-bookworm pinned by digest and already present in the local image store.
# It ships Node 22.23.3 (>= 22.6, so --experimental-strip-types can load the pinned
# upstream .ts module directly) plus Debian bookworm's python3 for the python3
# harness that runs /lab/reproduce.py. Both interpreters are part of the base image,
# so no interpreter is installed at build time.
base_image = "node:22-bookworm@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7"
dockerfile = "Dockerfile"
# Every artifact a --network none build needs:
#   * the two upstream tag tarballs from codeload.github.com (the archive URL is
#     addressed by refs/tags/<tag>, and the SHA-256 below is the one recorded in
#     fixtures/pin.json and re-verified against the local research/srcmirror copies);
#   * the locked dependency closure. It is empty: the execution path imports exactly
#     one upstream file, utils/graphql-query.ts, which has no imports and uses only
#     language features that Node strips as type annotations. README.zh-cn.md
#     (section "构建与输入") records the same conclusion, so no npm package is
#     fetched, vendored or installed.
# The Python side is CPython standard library only (reproduce.py, lab_support.py),
# so no wheel is needed either.
inputs = [
  { name = "vulnerable-source.tar.gz", url = "https://codeload.github.com/zereight/gitlab-mcp/tar.gz/refs/tags/v2.1.28", sha256 = "36448687dde8d9356c9cbf0c286e9bb56b635e0d740ea03ff292d4ed9b121753" },
  { name = "patched-source.tar.gz", url = "https://codeload.github.com/zereight/gitlab-mcp/tar.gz/refs/tags/v2.1.30", sha256 = "4e24c056b736897732ea151a90fa4520701bdffc327e8b9960bdfdd33b3c148a" },
]

[runtime]
isolation = "container"
platforms = ["linux/amd64"]
mode = "oneshot"
harness = "python3"
exceptions = []
requires_model = false
network_requirements = "none: the mechanism is a local, deterministic call into the pinned upstream classifier; the container needs no network at build or run time."

