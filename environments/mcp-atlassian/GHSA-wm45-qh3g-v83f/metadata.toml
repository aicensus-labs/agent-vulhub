product = "mcp-atlassian"
title = "MCP Atlassian attachment upload arbitrary server-side file read"
lifecycle = "draft"
agent_specificity = "agent_unique"
advisories = ["https://github.com/sooperset/mcp-atlassian/security/advisories/GHSA-wm45-qh3g-v83f", "https://github.com/advisories/GHSA-wm45-qh3g-v83f"]
description = "The attachment-upload tools accept a client-supplied file_path and open it on the server host. On a remote HTTP or SSE deployment, a client can read arbitrary server-readable files and exfiltrate them as Atlassian attachments, including secrets from /proc/self/environ."
prerequisites = ["Pinned mcp-atlassian 0.21.0 source", "Pinned mcp-atlassian 0.22.0 source", "A remote MCP transport with attachment upload enabled"]

