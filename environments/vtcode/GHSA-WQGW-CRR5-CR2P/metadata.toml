schema_version = 1
id = "vtcode/GHSA-WQGW-CRR5-CR2P"
ghsa = "GHSA-WQGW-CRR5-CR2P"
product = "vtcode"
title = "VT Code workspace lifecycle hook commands execute without per-command approval"
lifecycle = "draft"
agent_specificity = "agent_unique"
advisories = ["https://github.com/vinhnx/VTCode/security/advisories/GHSA-WQGW-CRR5-CR2P"]
description = "VT Code automatically loads a workspace-root vtcode.toml. In the vulnerable version, its session_start lifecycle command is passed to sh -c in the workspace during normal session setup without a per-command approval bound to the effective command. The patched version gates workspace-sourced lifecycle hooks behind an approval keyed to the exact command set and skips them in non-interactive modes until approval is granted."
prerequisites = ["A workspace-controlled vtcode.toml with a session_start hook", "Starting or resuming an Agent session in that workspace", "A harmless fixed marker command for mechanism validation"]

[vulnerable]
version = "0.144.0"
source_url = "https://github.com/vinhnx/VTCode"
commit = "058ec4166eaea25bdbedb3f577c905a761cab823"
image = ""
archive = "vulnerable-source.tar.gz"

[patched]
version = "0.145.0"
source_url = "https://github.com/vinhnx/VTCode"
commit = "9bbdc9123d4e01fa8f2e12e7abe341d4c69af66b"
image = ""
archive = "patched-source.tar.gz"

