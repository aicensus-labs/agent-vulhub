schema_version = 1
id = "safeinstall/GHSA-XRMC-C5CG-RV7X"
ghsa = "GHSA-XRMC-C5CG-RV7X"
product = "safeinstall"
title = "SafeInstall agent guard shell parsing can miss raw package execution"
lifecycle = "draft"
agent_specificity = "agent_unique"
# Advisory severity from the authoritative source, normalized to
# CRITICAL/HIGH/MEDIUM/LOW/NONE. Use "UNKNOWN" when no source publishes one.
severity = "HIGH"
advisories = ["https://github.com/advisories/GHSA-xrmc-c5cg-rv7x"]
description = "The SafeInstall agent guard classifies a shell segment by the basename of the token it believes is the command, without folding case, without skipping redirections that precede the command position and without modelling wrapper option arity. Commands such as `NPM install evil-pkg`, `2>err npm install evil-pkg`, `sudo -u root npm install evil-pkg` and `npm create vite@latest` therefore produce no install, runner or unanalyzable finding at all, so the guard fails open instead of denying or asking; 0.10.2 adds case folding, leading-redirection skipping, a wrapper option-arity table with a failure-closed branch and create/init runner findings."
prerequisites = [
  "A coding agent executes shell commands through the installed SafeInstall guard hook.",
  "The attacker can influence the command text the agent is about to run.",
]

[vulnerable]
version = "0.10.1"
source_url = "https://github.com/Mickdownunder/SafeInstall"
commit = "06e8370d7cff0916169b28b61b20a826958db223"
image = ""
archive = "safeinstall-cli-0.10.1.tgz"

