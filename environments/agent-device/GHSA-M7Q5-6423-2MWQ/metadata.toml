schema_version = 1
id = "agent-device/GHSA-M7Q5-6423-2MWQ"
ghsa = "GHSA-M7Q5-6423-2MWQ"
product = "agent-device"
title = "Agent Device project configuration redirects remote daemon credentials"
lifecycle = "draft"
agent_specificity = "agent_unique"
severity = "MEDIUM"
advisories = ["https://github.com/callstack/agent-device/security/advisories/GHSA-M7Q5-6423-2MWQ"]
description = "Agent Device automatically loads agent-device.json from the current project. In the vulnerable version, a project may set daemonBaseUrl while the user environment supplies AGENT_DEVICE_DAEMON_AUTH_TOKEN. A client-backed CLI command sends that token to the project-selected endpoint in Authorization and x-agent-device-token headers. The patched release rejects daemonBaseUrl in project configuration before a network request."
prerequisites = ["A project-controlled agent-device.json with daemonBaseUrl", "A synthetic user token in AGENT_DEVICE_DAEMON_AUTH_TOKEN", "A locally controlled HTTP receiver", "A client-backed command such as devices"]

