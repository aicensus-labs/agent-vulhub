schema_version = 1
id = "python-utcp/GHSA-8CP3-QXJ6-PX34"
ghsa = "GHSA-8CP3-QXJ6-PX34"
product = "python-utcp"
title = "utcp-http has an OAuth2 `tokenUrl` Trust Boundary Bypass in OpenAPI Conversion"
lifecycle = "draft"
agent_specificity = "agent_unique"
# Advisory severity from the authoritative source, normalized to
# CRITICAL/HIGH/MEDIUM/LOW/NONE. Use "UNKNOWN" when no source publishes one.
severity = "HIGH"
advisories = ["https://github.com/advisories/GHSA-8cp3-qxj6-px34"]
description = "utcp-http converts an untrusted OpenAPI document into tool call templates and copies the document's OAuth2 `clientCredentials.tokenUrl` verbatim into the generated OAuth2Auth. `_handle_oauth2` then POSTs the resolved `client_id`/`client_secret` to that attacker-controlled URL, so a malicious spec exfiltrates the client credentials to a non-loopback plaintext-HTTP endpoint. 1.1.4 applies the existing `ensure_secure_url` guard at the conversion site (`OAuth2 tokenUrl in OpenAPI spec`) and at the token sink (`OAuth2 token URL`)."
prerequisites = []

[vulnerable]
version = "1.1.3"
source_url = "https://github.com/universal-tool-calling-protocol/python-utcp/tree/244df66da6be64bcda2702a8d198b685f52ea46a"
commit = "244df66da6be64bcda2702a8d198b685f52ea46a"
image = ""
