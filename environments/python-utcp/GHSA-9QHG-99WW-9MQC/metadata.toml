schema_version = 1
id = "python-utcp/GHSA-9QHG-99WW-9MQC"
ghsa = "GHSA-9QHG-99WW-9MQC"
product = "python-utcp"
title = "utcp-http SSRF: HTTP tool invocation follows redirects without re-validating the target"
lifecycle = "draft"
agent_specificity = "agent_unique"
# Advisory severity from the authoritative source, normalized to
# CRITICAL/HIGH/MEDIUM/LOW/NONE. Use "UNKNOWN" when no source publishes one.
severity = "HIGH"
advisories = ["https://github.com/advisories/GHSA-9qhg-99ww-9mqc"]
description = "utcp-http <= 1.1.3 validates only the originally registered tool URL (ensure_secure_url) and then asks aiohttp to follow HTTP redirects; a redirect Location is fetched without re-validation, so an attacker-controlled tool endpoint can bounce the request to an internal address and return the protected body to the caller. 1.1.4 re-validates every redirect hop and raises before contacting the internal service."
prerequisites = []

