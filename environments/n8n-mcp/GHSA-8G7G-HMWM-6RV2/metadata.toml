schema_version = 1
id = "n8n-mcp/GHSA-8G7G-HMWM-6RV2"
ghsa = "GHSA-8G7G-HMWM-6RV2"
product = "n8n-mcp"
title = "n8n-mcp affected by path traversal, redirect-following SSRF, and telemetry payload exposure"
lifecycle = "draft"
agent_specificity = "agent_unique"
# Advisory severity from the authoritative source, normalized to
# CRITICAL/HIGH/MEDIUM/LOW/NONE. Use "UNKNOWN" when no source publishes one.
severity = "HIGH"
advisories = ["https://github.com/advisories/GHSA-8g7g-hmwm-6rv2"]
description = """
Three defects in the n8n-mcp MCP server packaged as npm `n8n-mcp`:
(1) `N8nApiClient.getWorkflow()` interpolates the caller-supplied workflow id
into the request path, so an id such as `../credentials` lands on
`/api/v1/credentials` and returns the protected credential listing on the same
axios instance that carries `X-N8N-API-KEY`;
(2) `N8nApiClient.triggerWebhook()` SSRF-validates only the initial URL and then
lets axios follow a 302 onto a second, unvalidated host, returning that host's
body to the caller;
(3) `MutationTracker.processMutation()` keeps verbatim node parameter values in
its telemetry record, so a bearer token typed into a node parameter leaves the
process with the default opt-in telemetry.
"""
prerequisites = [
  "Docker with the pinned node:22-bookworm base image present locally",
  "No external network: the reproduction only contacts loopback listeners it owns",
]

