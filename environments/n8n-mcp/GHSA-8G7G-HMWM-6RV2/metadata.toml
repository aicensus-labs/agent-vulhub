version = "2.50.0"
source_url = "https://github.com/czlonkowski/n8n-mcp/tree/v2.50.0"
commit = "1ca40ce2bdf18b8c88cd571074cec3f61471c7eb"
image = ""
archive = "n8n-mcp-2.50.0.tgz"

[patched]
