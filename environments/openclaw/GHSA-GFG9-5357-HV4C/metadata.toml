schema_version = 1
id = "openclaw/GHSA-GFG9-5357-HV4C"
ghsa = "GHSA-GFG9-5357-HV4C"
product = "openclaw"
title = "OpenClaw: Webchat audio embedding could read local files without local-root containment"
lifecycle = "draft"
agent_specificity = "agent_unique"
# Advisory severity from the authoritative source, normalized to
# CRITICAL/HIGH/MEDIUM/LOW/NONE. Use "UNKNOWN" when no source publishes one.
severity = "MEDIUM"
advisories = ["https://github.com/advisories/GHSA-gfg9-5357-hv4c"]
description = "buildWebchatAudioContentBlocksFromReplyPayloads() in src/gateway/server-methods/chat-webchat-media.ts resolved every mediaUrl of a reply payload to an absolute local path and read it with fs.readFileSync, base64-embedding the bytes into the chat WebSocket as an audio block. resolveLocalMediaPathForEmbedding() accepted any absolute path and any file: URL and never compared the resolved path against the allowed local media roots, so a tool/agent reply whose mediaUrl was chosen by an attacker through prompt injection (CWE-22 path traversal / CWE-200 exposure) exfiltrated arbitrary host files readable by the gateway process that carry an audio extension. The fix (041266a6699cac3baef8ef39db41fa26f29f9db3, v2026.4.15) routes resolution through assertLocalMediaAllowed() with the caller-supplied localRoots and reports the denial via onLocalAudioAccessDenied."
prerequisites = [
  "A local webchat/Control-UI reply payload whose mediaUrl (or mediaUrls[]) points at an absolute path or file: URL outside the configured allowed local media roots.",
  "The attacker can steer that mediaUrl field through prompt injection or a compromised tool result.",
  "The referenced file is a regular file with an audio extension and at most 15 MiB.",
]

