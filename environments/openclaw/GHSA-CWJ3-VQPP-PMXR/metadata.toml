schema_version = 1
id = "openclaw/GHSA-CWJ3-VQPP-PMXR"
ghsa = "GHSA-CWJ3-VQPP-PMXR"
product = "openclaw"
title = "OpenClaw's gateway config mutation guard allowed unsafe model-driven config writes"
lifecycle = "draft"
agent_specificity = "agent_unique"
# Advisory severity from the authoritative source, normalized to
# CRITICAL/HIGH/MEDIUM/LOW/NONE. Use "UNKNOWN" when no source publishes one.
severity = "HIGH"
advisories = ["https://github.com/advisories/GHSA-cwj3-vqpp-pmxr"]
description = "In release 2026.4.22 the gateway tool decided whether an agent-driven config.apply/config.patch could be persisted with a hand-maintained denylist (PROTECTED_GATEWAY_CONFIG_PATHS). Any protected path the list did not enumerate (gateway.remote.url, tools.allow/tools.elevated.enabled, memory.qmd.command, browser.executablePath) was written through, so a model-driven config mutation crossed the trusted-config boundary into attacker-chosen command, endpoint and executable settings. Release 2026.4.23 replaces the denylist with a fail-closed allowlist (ALLOWED_GATEWAY_CONFIG_PATHS)."
prerequisites = []

[vulnerable]
version = "2026.4.22"
source_url = "https://github.com/openclaw/openclaw/tree/v2026.4.22"
commit = "02a8c135016665f0ef58122cf67bdeade507f645"
image = ""
archive = "vulnerable-source.tar.gz"

[patched]
version = "2026.4.23"
source_url = "https://github.com/openclaw/openclaw/tree/v2026.4.23"
commit = "bceda6089aa7b3695cc7696b43c61ae3d01bb0ec"
image = ""
archive = "patched-source.tar.gz"

