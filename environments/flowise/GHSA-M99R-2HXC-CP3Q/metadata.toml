schema_version = 1
id = "flowise/GHSA-M99R-2HXC-CP3Q"
ghsa = "GHSA-M99R-2HXC-CP3Q"
product = "flowise"
title = "Flowise has an MCP Security Bypass that Enables RCE"
lifecycle = "draft"
agent_specificity = "agent_unique"
# Advisory severity from the authoritative source, normalized to
# CRITICAL/HIGH/MEDIUM/LOW/NONE. Use "UNKNOWN" when no source publishes one.
severity = "HIGH"
advisories = ["https://github.com/advisories/GHSA-m99r-2hxc-cp3q"]
description = """
The Custom MCP node stores its mcpServerConfig as attacker-controlled input: any
authenticated user, or any API key with view & update permission on a chatflow,
can write it and reach it through POST /api/v1/prediction/{chatflow_id}. The only
server-side gate is validateMCPServerConfig() in
packages/components/nodes/tools/MCP/core.ts. Its local-file-access rule uses
/^\\/[^/]/, which does not match a path beginning with two slashes, so
{"command": "node", "args": ["//pre-staged.js"]} passes validation even though a
normal absolute path is rejected. The unmodified serverParams.command/args are
then handed to MCPToolkit -> StdioClientTransport, which spawns the child process
on the Flowise host: whitelist bypass equals arbitrary command execution. The
same allowlist also omits docker's build subcommand and npx's --yes long form.
Version 3.1.2 tightens the regex to /^\\// and adds the missing denylist entries.
"""
prerequisites = [
    "A Flowise account of any role, or an API key with view & update permission on the target chatflow",
    "The server-side deployment has node, npx or docker on PATH (all three are on the command allowlist)",
    "CUSTOM_MCP_SECURITY_CHECK is left at its default value so validateMCPServerConfig() actually runs",
    "The attacker-controlled JavaScript is already present at a known absolute path on the server (the advisory's upload plus export-import path recovery step)",
]

