# 漏洞图解的单一来源。编辑本文件后运行：
#   python3 -m runner diagram flowise/GHSA-M99R-2HXC-CP3Q
# 生成 diagram/mechanism.mmd、diagram/entities.mmd 和 README.zh-cn.md 中的图解区块。
# 字段、枚举和校验规则见 docs/diagram-contract.md。
#
# 图只描述漏洞本身：攻击者可控输入、受影响的上游组件、被调用的工具、被读写的存储，
# 以及受控效果落点。不要写复现工具链（runner、verify.py、结果卷、容器编排、协议替身、
# fixture 装载），它们不属于漏洞的触发过程。
schema_version = 1
title = "flowise / GHSA-M99R-2HXC-CP3Q 漏洞图解"
summary = "Custom MCP 节点的 mcpServerConfig 由任意登录用户或持有 chatflow 更新权限的 API key 提交，服务端只靠 validateMCPServerConfig() 把关。该函数用 /^\\/[^/]/ 判断绝对路径，双斜杠开头的路径不被匹配，于是 {\"command\":\"node\",\"args\":[\"//...\"]} 通过校验，serverParams 被原样交给 MCP stdio transport 并在 Flowise 主机上真实 spawn 子进程。修复版把正则收紧为 /^\\//，并补齐 npx 的 --yes 与 docker 的 build 等黑名单条目，同一输入在校验阶段就被拒绝。"
[[entities]]
id = "attacker"
label = "攻击者"
kind = "actor"
trust = "attacker_controlled"
role = "拥有任意角色 Flowise 账号或 chatflow view & update API key，负责写入 Custom MCP 节点的 mcpServerConfig。"
[[entities]]
id = "uploaded_script"
label = "预先落盘的服务端 JS 脚本"
kind = "store"
trust = "attacker_controlled"
role = "攻击者上一步放在服务器本地路径上的 JS 文件；节点配置通过校验后，它就是要被 node 加载执行的内容。"
source = "fixtures/mcp_payload.js"
[[entities]]
id = "mcp_config"
label = "Custom MCP 节点配置 mcpServerConfig"
kind = "client"
trust = "untrusted_input"
role = "攻击者提交的 JSON，决定 command 与 args；serverParams.command/args 原样流向 stdio transport。"
source = "fixtures/attack_config.json"
[[entities]]
id = "config_validator"
label = "validateMCPServerConfig 校验闸门"
kind = "service"
trust = "trusted"
role = "唯一把关点：白名单命令、参数本地文件访问、命令注入与危险 flag 检查都集中在这里，双斜杠绝对路径从它的正则缺口漏过。"
[[entities]]
id = "mcp_node"
label = "Custom MCP 节点与 MCPToolkit"
kind = "service"
trust = "trusted"
role = "getTools() 校验通过后构造 MCPToolkit(serverParams,'stdio') 并 initialize()，把未改写的配置交给 stdio transport。"
[[entities]]
id = "spawned_process"
label = "StdioClientTransport 启动的 node 子进程"
kind = "tool"
trust = "trusted"
role = "在服务器上真实 spawn 出 process.execPath；node 加载攻击者落盘的 JS，漏洞效果在此落地。"
[[entities]]
id = "child_effect"
label = "被加载 JS 写出的执行标记"
kind = "sink"
trust = "trusted"
synthetic = true
role = "子进程执行后写下的受控标记，用来证明任意命令确实在服务器上跑过，不代表真实的外部攻击目标。"
[[boundaries]]
id = "attacker_side"
label = "攻击者可控输入"
members = ["attacker", "uploaded_script", "mcp_config"]
note = "攻击者只能控制自己提交的节点配置内容，以及上一步落在服务器上的那个 JS 文件；它无法让校验函数改变判定。"
[[boundaries]]
id = "server_side"
label = "Flowise 服务端与它信任的数据"
members = ["config_validator", "mcp_node", "spawned_process", "child_effect"]
note = "这道边界本来只允许白名单命令加载合法 MCP server；校验漏判绝对路径后，同一份配置直接变成服务器上的命令执行。"
[[steps]]
n = 1
phase = "setup"
from = "attacker"
to = "uploaded_script"
action = "攻击者先把要用 node 执行的 JS 放到服务器本地路径上"
detail = "advisory 的完整链路是上传文件再借 export-import 接口取回绝对路径；机制复现把这一步当作已成立前提，直接给定落盘位置。"
source = "fixtures/mcp_payload.js"
variant = "both"
[[steps]]
n = 2
phase = "setup"
from = "attacker"
to = "mcp_config"
action = "攻击者把 command 设为 node、args 写成双斜杠绝对路径，组成 Custom MCP 节点配置"
detail = "任何登录用户，或对 chatflow 有 view & update 权限的 API key 都能写入该节点配置。"
source = "fixtures/attack_config.json"
variant = "both"
[[steps]]
n = 3
phase = "setup"
from = "mcp_config"
to = "config_validator"
action = "配置经 POST /api/v1/prediction/{chatflow_id} 提交后原样进入服务端校验闸门"
variant = "both"
[[steps]]
n = 4
phase = "trigger"
from = "config_validator"
to = "config_validator"
action = "validateArgsForLocalFileAccess 的 /^\\/[^/]/ 不匹配双斜杠开头的参数，命令白名单 node 又恰好放行，配置通过校验"
detail = "同一版校验仍会拒绝规范的 /etc/passwd，说明检查确实在运行，漏判的只是双斜杠写法。"
variant = "both"
[[steps]]
n = 5
phase = "trigger"
from = "mcp_node"
to = "spawned_process"
action = "校验放行后 MCPToolkit.initialize() 把未改写的 serverParams.command 与 args 交给 StdioClientTransport 并 spawn node 子进程"
variant = "vulnerable_only"
diverges = true
[[steps]]
n = 6
phase = "effect"
from = "spawned_process"
to = "uploaded_script"
action = "子进程按命令行参数加载并执行攻击者落盘的 JS"
variant = "vulnerable_only"
[[steps]]
n = 7
phase = "effect"
from = "uploaded_script"
to = "child_effect"
action = "被加载的 JS 在服务器上写出执行标记，任意代码执行落地"
variant = "vulnerable_only"
[[steps]]
n = 8
phase = "trigger"
from = "config_validator"
to = "mcp_node"
action = "修复版改用 /^\\// 并在黑名单补上 npx --yes 与 docker build，同一份配置在校验阶段即被拒绝，不再进入 transport"
variant = "patched_only"
diverges = true
