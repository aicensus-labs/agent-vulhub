schema_version = 1
id = "openclaw-mcp/GHSA-C4QG-MG2R-2C56"
ghsa = "GHSA-C4QG-MG2R-2C56"
product = "openclaw-mcp"
title = "Cross-Client Async Task Leakage in `openclaw-mcp`"
lifecycle = "draft"
agent_specificity = "agent_unique"
# Advisory severity from the authoritative source, normalized to
# CRITICAL/HIGH/MEDIUM/LOW/NONE. Use "UNKNOWN" when no source publishes one.
severity = "MEDIUM"
advisories = ["https://github.com/freema/openclaw-mcp/security/advisories/GHSA-c4qg-mg2r-2c56"]
description = "Before 1.7.0 the HTTP transport of openclaw-mcp kept one process-wide TaskManager singleton, and the async task tools (openclaw_task_status/list/cancel) looked tasks up by ID with no owner check. Any second MCP connection to the same process could therefore list another client's tasks, read its prompt and completed result through openclaw_task_status, or cancel its pending task; the sequential task_<timestamp>_<counter> IDs made the lookup easy to enumerate. 1.7.0 gives every task an ownerId bound to the MCP connection and scopes get/list/stats/cancel to it, and replaces the enumerable ID with a random UUID."
prerequisites = ["openclaw-mcp serves HTTP (Streamable HTTP) mode in one process and at least two independent MCP connections reach it"]

[vulnerable]
version = "1.6.0"
source_url = "https://github.com/freema/openclaw-mcp"
commit = "a07a30826ab1ff5cceb43f047699008dcaf70238"
image = ""
archive = "vulnerable-source.tar.gz"

[patched]
version = "1.7.0"
source_url = "https://github.com/freema/openclaw-mcp"
commit = "751d58a4d6947809e18d968d92604e50398ee98c"
image = ""
archive = "patched-source.tar.gz"

