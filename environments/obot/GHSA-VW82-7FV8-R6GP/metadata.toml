schema_version = 1
id = "obot/GHSA-VW82-7FV8-R6GP"
ghsa = "GHSA-VW82-7FV8-R6GP"
product = "obot"
title = "Obot has an authorization bypass in /mcp-connect/{id} that allows any authenticated user to use any registered MCP server"
lifecycle = "draft"
agent_specificity = "agent_unique"
# Advisory severity from the authoritative source, normalized to
# CRITICAL/HIGH/MEDIUM/LOW/NONE. Use "UNKNOWN" when no source publishes one.
severity = "CRITICAL"
advisories = ["https://github.com/advisories/GHSA-vw82-7fv8-r6gp"]
description = "Obot's API authorizer in pkg/api/authz (v0.21.0) lets any authenticated user reach /mcp-connect/{mcp_id}. The blanket staticRules[anyGroup] entry for the \"/mcp-connect/\" prefix makes Authorizer.Authorize return true before the request ever reaches the per-server checkMCPID access-control-rule evaluation, and the /api-only UI fallback admits the same path a second time. The trust boundary that fails is between an authenticated-but-unauthorized caller and a registered MCP server: the mcp_id path segment is treated as authorized on its prefix alone while ownership and access-control-rule checks are skipped. v0.21.1 removes both escapes, so the request falls through to the access-control-rule evaluation and non-ACR principals are denied."
prerequisites = ["Pinned obot v0.21.0 and v0.21.1 source archives (fixed commits, not tags that can move)", "A pinned Go 1.26.2 toolchain and the locked module closure for pkg/api/authz, both supplied as offline build inputs", "No network is required at build or run time; the lab compose network is internal"]

