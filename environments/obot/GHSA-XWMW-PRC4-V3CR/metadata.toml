[build]
# Official Go image, already present locally. It ships python3 (Debian 3.11) for the
# lab harness; the pinned go1.26.6 toolchain is a build input because both pinned
# go.mod revisions require >= go1.26.2.
base_image = "golang:1.26.1-bookworm@sha256:ab3d6955bbc813a0f3fdf220c1d817dd89c0b3f283777db8ece4a32fe7858edd"
dockerfile = "Dockerfile"
# Each entry: { name = "...", url = "https://...", sha256 = "..." }
# Complete locked closure of both pinned go.mod/go.sum revisions: the two upstream
# source archives, the pinned Go toolchain, and every module the go command resolved
# for ./pkg/jwt/persistent/ (go.mod + module zip), served to the offline build through
# a local file:// GOPROXY rebuilt from go-proxy.map.  Proxy .info responses are
# deliberately absent: their JSON key order is not stable across proxy responses, so
# they carry no reproducible SHA-256, and a pinned build never requests them (verified
# by compiling the package offline against a mod+zip-only proxy).
