  { name = "go1.26.6.linux-amd64.tar.gz", url = "https://go.dev/dl/go1.26.6.linux-amd64.tar.gz", sha256 = "708effb774be8237570d0add163225abbdfaf4fca28b2611df167beba4feef89" },
