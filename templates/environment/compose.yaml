services:
  vulnerable:
    profiles: [vulnerable]
    image: "${VULNERABLE_IMAGE:?Set a verified vulnerable image digest}"
    init: true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [lab]
  patched:
    profiles: [patched]
    image: "${PATCHED_IMAGE:?Set a verified patched image digest}"
    init: true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [lab]
networks:
  lab:
    internal: true
